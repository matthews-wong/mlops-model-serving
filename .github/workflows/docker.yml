name: Docker

# Builds the container image on every push to main to prove the Dockerfile
# stays valid. The push-to-registry step is intentionally DISABLED by default
# (push: false) so this workflow succeeds in a fresh fork WITHOUT any registry
# secrets configured.
#
# To publish images:
#   1. Create a repository secret/permission for your registry (for GHCR the
#      built-in GITHUB_TOKEN with `packages: write` is enough).
#   2. Uncomment the "Log in to GHCR" step below.
#   3. Set `push: true` in the build-push step (or gate it on a git tag).

on:
  push:
    branches: ["main"]
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- Registry login (disabled by default) --------------------------
      # Uncomment to enable pushing to GitHub Container Registry.
      # - name: Log in to GHCR
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          # push is FALSE so the job never fails for lack of registry secrets.
          # Flip to `true` (and enable the login step above) to publish.
          push: false
          tags: ghcr.io/matthews-wong/mlops-model-serving:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
