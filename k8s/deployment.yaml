apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-model-serving
  labels:
    app: mlops-model-serving
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mlops-model-serving
  template:
    metadata:
      labels:
        app: mlops-model-serving
      annotations:
        # Let Prometheus discover and scrape the /metrics endpoint.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          # Replace with your registry/image:tag once published.
          image: ghcr.io/matthews-wong/mlops-model-serving:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: mlops-model-serving-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
