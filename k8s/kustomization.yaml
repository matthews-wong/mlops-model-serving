apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Enables `kubectl apply -k k8s/` to apply all manifests together.
resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml

commonLabels:
  app.kubernetes.io/name: mlops-model-serving
  app.kubernetes.io/part-of: cloud-ai-portfolio
